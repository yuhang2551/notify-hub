[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notify-hub"
version = "0.3.0"
description = "把通知推到手机上的 Lark：调用一次发一次，连不上当场重试，还发不出去就报错；什么时候发由调用方决定。"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "python-dotenv>=1",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
notify-hub = "notify_hub.cli:app"

[tool.setuptools.packages.find]
include = ["notify_hub*"]

[tool.setuptools.package-data]
notify_hub = ["env.example"]

[tool.pytest.ini_options]
testpaths = ["tests"]
