[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notify-hub"
version = "0.2.1"
description = "本机通知网关：各个程序调用同一个命令，按级别、去重、限流、失败重发的规则推到手机上的 Lark。"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "python-dotenv>=1",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
notify-hub = "notify_hub.cli:app"

[tool.setuptools.packages.find]
include = ["notify_hub*"]

[tool.setuptools.package-data]
notify_hub = ["env.example"]

[tool.pytest.ini_options]
testpaths = ["tests"]
